<a
  class="back-to-top"
  href="#topo"
  aria-label="Voltar ao topo"
  [class.is-visible]="visible()"
  [attr.tabindex]="visible() ? null : -1"
  [attr.aria-hidden]="visible() ? null : 'true'"
>
  <svg
    class="back-to-top__icon"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M12 19V5" />
    <path d="m5 12 7-7 7 7" />
  </svg>
</a>
