<section class="section" id="publico" aria-labelledby="publico-title">
  <div class="container">
    <div class="section__head">
      <p class="eyebrow">Para quem é</p>
      <h2 id="publico-title">Feito para quem vive de tecnologia.</h2>
    </div>

    <ul class="audience-grid">
      @for (card of cards; track card.title) {
        <li class="card audience-card">
          <span class="audience-card__icon" aria-hidden="true">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              focusable="false"
              aria-hidden="true"
            >
              @switch (card.icon) {
                @case ('code') {
                  <polyline points="16 18 22 12 16 6" />
                  <polyline points="8 6 2 12 8 18" />
                }
                @case ('team') {
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                }
                @case ('layers') {
                  <polygon points="12 2 2 7 12 12 22 7 12 2" />
                  <polyline points="2 17 12 22 22 17" />
                  <polyline points="2 12 12 17 22 12" />
                }
                @case ('trend') {
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                  <polyline points="17 6 23 6 23 12" />
                }
              }
            </svg>
          </span>
          <h3 class="audience-card__title">{{ card.title }}</h3>
          <p class="audience-card__description">{{ card.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
