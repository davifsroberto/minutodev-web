<section class="section" id="o-que-encontra" aria-labelledby="offerings-title">
  <div class="container">
    <div class="section__head">
      <p class="eyebrow">O que você encontra</p>
      <h2 id="offerings-title">O que você encontra no radar.</h2>
      <p class="lead">
        Todos os dias, o minutoDev organiza os sinais mais relevantes da
        comunidade de tecnologia.
      </p>
    </div>

    <ul class="offerings-grid">
      @for (card of cards; track card.title) {
        <li class="card offering-card">
          <span class="offering-card__icon" aria-hidden="true">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              focusable="false"
              aria-hidden="true"
            >
              @switch (card.icon) {
                @case ('trend') {
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                  <polyline points="17 6 23 6 23 12" />
                }
                @case ('tool') {
                  <path
                    d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                  />
                }
                @case ('release') {
                  <path
                    d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                  />
                  <line x1="7" y1="7" x2="7.01" y2="7" />
                }
                @case ('project') {
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                }
                @case ('content') {
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                }
              }
            </svg>
          </span>
          <h3 class="offering-card__title">{{ card.title }}</h3>
          <p class="offering-card__description">{{ card.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
