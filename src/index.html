<!doctype html>
<html lang="pt-BR">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>minutoDev — O radar diário de tecnologia para devs</title>
    <meta
      name="description"
      content="O radar diário de tecnologia para desenvolvedores. Acompanhe tendências, ferramentas e novidades em poucos minutos por dia, sem garimpar dezenas de fontes."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7132f5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('minutodev-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
